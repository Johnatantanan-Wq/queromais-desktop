<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Pediu! Desktop</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="elo.css">
</head>
<body>
  <div id="titlebar">
    <span style="font-size:12.5px;font-weight:700;color:#4b5563" id="tbNome">Pediu! Desktop</span>
    <span class="janela">
      <button class="jb" id="jbMin" title="Minimizar">—</button>
      <button class="jb" id="jbMax" title="Maximizar">▢</button>
      <button class="jb fechar" id="jbFechar" title="Fechar">✕</button>
    </span>
  </div>

  <nav id="erail">
    <div class="erailtop">
      <div class="erailbrand">
        <img id="erailLogo" src="../../assets/logo-marca.svg" alt="">
        <div id="erailNomeMarca" class="eraillogotexto" style="display:none;font-size:20px;font-weight:800;color:#111"></div>
        <div class="eraillabel">Gestão</div>
      </div>
      <button type="button" class="erailtoggle" id="erailToggle" title="Recolher menu">‹</button>
    </div>
    <div class="erailnav" id="erailNav"></div>
    <div class="erailfoot">
      <div class="erailuser">
        <div class="erailavatar" id="erailAvatar">—</div>
        <div class="erailuinfo">
          <div class="erailuname" id="erailNome">—</div>
          <div class="erailudoc" id="erailDoc"></div>
        </div>
      </div>
      <button type="button" class="erailsair" id="erailSair"><span class="lbl">Sair</span></button>
    </div>
  </nav>

  <div id="etopbar">
    <div>
      <div class="etitle" id="etitle">Painel</div>
      <div class="edate" id="edate"></div>
    </div>
    <div class="etopright">
      <button class="echip" id="btnBusca" title="Buscar (⌘K)" style="display:flex;align-items:center;gap:7px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <span>Buscar</span>
        <span style="font-size:10.5px;font-weight:700;color:#9ca3af;border:1px solid #e5e7eb;border-radius:5px;padding:1px 5px">⌘K</span>
      </button>
      <button class="eiconbtn" id="btnSino" title="Avisos" style="position:relative">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        <span id="sinoContador" style="display:none;position:absolute;top:2px;right:2px;min-width:16px;height:16px;
          border-radius:999px;background:#b42318;color:#fff;font-size:10px;font-weight:800;line-height:16px;
          text-align:center;padding:0 3px"></span>
      </button>
      <button class="echip" id="chipRede">verificando…</button>
      <button class="echip" id="chipSplit">tela dividida</button>
      <button class="eiconbtn" id="btnWhats" title="WhatsApp">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.5 8.5 0 01-3.9-.9L3 21l2-4.9A8.4 8.4 0 1121 11.5z"/></svg>
      </button>
    </div>
  </div>

  <div id="eaviso"></div>

  <div id="econtent"></div>

  <script src="shell.js"></script>
</body>
</html>
